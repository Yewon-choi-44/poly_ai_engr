<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Document</title>
    <style>
        ul {list-style:none;
             /* 불릿 없앰 */
            margin-left:-30px;
            /* 왼쪽 여백 -30px */
        }
