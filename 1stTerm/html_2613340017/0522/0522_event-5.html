<!DOCTYPE html>
<html lang="ko">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>DOM event 객체</title>
  <style>
    #container {
      width:300px;
      margin:10px auto;
    }
  </style>
</head>
<body>
	<div id="container">
		<img src="C:/Users/AI-00/Downloads/화면 캡처 2026-05-22 100027.png" id="cover">	
  </div>
  
	<script>
		var cover = document.getElementById("cover");
		cover.addEventListener("mouseover",changePic, false);
    cover.addEventListener("mouseout",originPic, false);
    
    function changePic() {
      cover.src = "C:/Users/AI-00/Downloads/화면 캡처 2026-05-22 100027.png";
    }
    function originPic() {
      cover.src = "C:/Users/AI-00/Downloads/화면 캡처 2026-05-22 100051.png";
    }
	</script>
</body>
</html>
