<!DOCTYPE html>
<html lang="ko">
	<head>
		<meta charset="UTF-8">
		<title>연습문제 3</title>
		<style>
			a:link, a:visited {
				color:black; 
				text-decoration: none;
			}
			a:hover { 
                /* 버튼 누를 때 깜박이는 효과 */
				background-color:#000; /* 마우스 댔을 때 바뀌는 버튼색*/
				color:#00f; /* 마우스 댔을 때 바뀌는 글자색*/
			}

            ul{
                list-style: none; /*불릿 삭제*/
            }

            li{
                float: left; /* 왼쪽 정렬 */
            }

             a {
                display: block; /* 가로로 정렬 */
                padding: 10px 20px; /* 글자간 간격 : 너비 높이 지정 */
                background-color: #ccc;  /* 글자 배경색 지정 */
            } 

		</style>
	</head>
	<body>
		<nav>
			<ul>
				<li><a href="#">메뉴1</a></li> <!-- href="링크" -->
				<li><a href="#">메뉴2</a></li>
				<li><a href="#">메뉴3</a></li>
				<li><a href="#">메뉴4</a></li>
			</ul>
		</nav>
	</body>
</html>
