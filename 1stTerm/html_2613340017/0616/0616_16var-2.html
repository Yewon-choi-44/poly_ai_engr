<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>상수 사용하기</title>
</head>
<body>
    <script>
        const PI = 3.14; /* 원주율을 상수로 선언 */
        let radius = prompt("반지름을 입력하세요."); /* 반지름값 입력 받기 */
        let area = PI * radius * radius; /* 변수를 사용해 원의 넓이 계산 */ 
        console.log(area); /* 원의 넓이를 알림창에 출력*/
    </script>
    </body>
</html>
