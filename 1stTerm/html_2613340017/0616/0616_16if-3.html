<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>조건 연산자를 사용해 3의 배수 확인하기</title>
</head>
<body>
    <script>
        let userNumber = parseInt(prompt("숫자를 입력하세요: "));

        if (userNumber !== null){
            (parseInt(userNumber) % 3 === 0 ? alert("3의 배수입니다.") : alert("3의 배수가 아닙니다."));
        }
        else{
            alert("입력이 취소됐습니다.");
        }
    </script>
</body>
</html>
