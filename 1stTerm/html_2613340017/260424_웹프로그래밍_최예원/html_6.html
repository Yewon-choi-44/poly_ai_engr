<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>6.왼쪽의 목록을 오른쪽의 목록으로 작성하시오.</title>

    <style>
       .navi ul dl{
        float: left;
    
       }
       
       .navi a:link, .navi a:visited{
        display: block;
        padding: 10px 20px;
        background-color: #ccc;
        color:#000;
        text-decoration: none;
       }

       .navi a:hover, .navi a:focus{
        background-color: #000;
        color:#fff
       }
    </style>
</head>
<body>
    <nav class="navi">
        <ul>
            <dl><a href="#">메뉴1</a></dl>
            <dl><a href="#">메뉴2</a></dl>
            <dl><a href="#">메뉴3</a></dl>
            <dl><a href="#">메뉴4</a></dl>
        </ul>
    </nav>
</body>
</html>
